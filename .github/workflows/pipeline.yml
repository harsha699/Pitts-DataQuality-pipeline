name: Weekly Data Quality Pipeline

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:  # Allow manual runs

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: python src/pipeline.py --dataset sample

      # TODO: Add step to upload archive/ to Cloudflare R2 or other storage
      # using secrets (R2_ACCESS_KEY, R2_SECRET_KEY, R2_BUCKET, R2_ENDPOINT)
      - name: List archive output
        run: ls -la archive/ || echo "No archive yet"
